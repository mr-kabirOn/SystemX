name: systemx
description: "SystemX: device info and phone diagnostics"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dynamic_color: 1.8.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  camera: ^0.12.0+2
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  pigeon: ^27.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-Sora.txt
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
